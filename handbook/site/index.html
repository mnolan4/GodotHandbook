<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Godot Studio Handbook</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,560&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
  <aside class="sidebar">
    <h1>Godot handbook</h1>
    <p class="edition">4.7</p>
    <input id="q" type="search" placeholder="Search the handbook" autocomplete="off" aria-label="Search the handbook">
    <nav id="nav" aria-label="Chapters"></nav>
    <ol id="hits" aria-live="polite"></ol>
  </aside>
  <main>
    <p class="crumb" id="crumb"></p>
    <article id="doc"></article>
    <figure class="viz" id="viz" hidden>
      <iframe id="frame" title="Diagram"></iframe>
    </figure>
    <nav class="pager" id="pager" aria-label="Chapter"></nav>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
  <script src="app.js?v=2"></script>
</body>
</html>
