<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signal flow</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; background: #14110e; overflow: hidden; }
    canvas { display: block; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js"></script>
</head>
<body>
<script>
// Blue-green travels up as a signal. Copper travels down as a call.
const INK = [239, 230, 212];
const COPPER = [212, 120, 74];
const BLUE_GREEN = [72, 168, 154];
const GOLD = [228, 177, 90];
const DUST = [150, 136, 118];

let plate;
let phase = "idle";
let t = 0;
let score = 0;
let ripples = [];

function setup() {
  createCanvas(windowWidth, windowHeight);
  pixelDensity(Math.min(2, window.devicePixelRatio || 1));
  textFont("IBM Plex Mono, ui-monospace, monospace");
  rebuild();
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  rebuild();
}

function rebuild() {
  plate = createGraphics(width, height);
  plate.pixelDensity(1);
  for (let y = 0; y < height; y++) {
    plate.stroke(lerp(16, 36, y / height), lerp(13, 24, y / height), lerp(11, 18, y / height));
    plate.line(0, y, width, y);
  }
  for (let i = 0; i < 1400; i++) {
    plate.stroke(239, 230, 212, random(6, 22));
    plate.point(random(width), random(height));
  }
}

function levelPos() { return { x: width * 0.5, y: height * 0.38 }; }
function coinPos() { return { x: width * 0.28, y: height * 0.68 }; }
function hudPos() { return { x: width * 0.72, y: height * 0.68 }; }

function draw() {
  image(plate, 0, 0);
  const level = levelPos();
  const coin = coinPos();
  const hud = hudPos();
  link(coin, level, BLUE_GREEN, phase !== "idle");
  link(level, hud, COPPER, phase === "call" || phase === "done");

  if (phase === "signal") {
    t += deltaTime / 900;
    packet(coin, level, constrain(t, 0, 1), BLUE_GREEN);
    if (t >= 1) { phase = "call"; t = 0; }
  } else if (phase === "call") {
    t += deltaTime / 900;
    packet(level, hud, constrain(t, 0, 1), COPPER);
    if (t >= 1) {
      phase = "done";
      score += 1;
      ripples.push({ x: hud.x, y: hud.y, r: 10 });
    }
  }

  node(level, "Level", "listens, then calls", phase === "call");
  node(coin, "Coin", "emits collected", phase === "signal");
  node(hud, "HUD", "only displays", phase === "done");

  for (let i = ripples.length - 1; i >= 0; i--) {
    const rip = ripples[i];
    rip.r += deltaTime * 0.08;
    noFill();
    stroke(GOLD[0], GOLD[1], GOLD[2], Math.max(0, 180 - rip.r));
    strokeWeight(1.5);
    circle(rip.x, rip.y, rip.r * 2);
    if (rip.r > 180) ripples.splice(i, 1);
  }

  caption();
}

function link(a, b, col, hot) {
  stroke(col[0], col[1], col[2], hot ? 170 : 60);
  strokeWeight(hot ? 2 : 1.15);
  noFill();
  const midY = (a.y + b.y) / 2;
  bezier(a.x, a.y, a.x, midY, b.x, midY, b.x, b.y);
}

function packet(a, b, u, col) {
  const midY = (a.y + b.y) / 2;
  const x = bezierPoint(a.x, a.x, b.x, b.x, u);
  const y = bezierPoint(a.y, midY, midY, b.y, u);
  noStroke();
  fill(col[0], col[1], col[2], 40);
  circle(x, y, 28);
  fill(INK);
  circle(x, y, 8);
}

function node(p, title, sub, hot) {
  const w = 150;
  const h = 64;
  noStroke();
  fill(18, 14, 11, 230);
  rect(p.x - w / 2, p.y - h / 2, w, h, 3);
  stroke(hot ? GOLD[0] : COPPER[0], hot ? GOLD[1] : COPPER[1], hot ? GOLD[2] : COPPER[2], 210);
  strokeWeight(hot ? 2 : 1);
  noFill();
  rect(p.x - w / 2, p.y - h / 2, w, h, 3);
  noStroke();
  fill(INK);
  textAlign(CENTER, CENTER);
  textSize(14);
  text(title, p.x, p.y - 8);
  fill(DUST);
  textSize(11);
  text(sub, p.x, p.y + 12);
}

function caption() {
  noStroke();
  fill(20, 16, 13, 220);
  rect(24, height - 78, width - 48, 58, 3);
  noStroke();
  fill(GOLD);
  textAlign(LEFT, TOP);
  textSize(11);
  text(phase === "idle" ? "CLICK THE COIN  ·  SPACE SENDS collected" : phase === "signal" ? "SIGNAL UP  ·  collected" : phase === "call" ? "CALL DOWN  ·  set_count" : "HUD SCORE  " + score, 40, height - 66);
  fill(INK);
  textSize(13);
  text("The coin never mentions the HUD. The level is the only one who knows both.", 40, height - 46);
}

function mousePressed() {
  const c = coinPos();
  if (dist(mouseX, mouseY, c.x, c.y) < 80) fire();
}

function keyPressed() {
  if (key === " ") fire();
}

function fire() {
  if (phase === "signal" || phase === "call") return;
  phase = "signal";
  t = 0;
}
</script>
</body>
</html>
