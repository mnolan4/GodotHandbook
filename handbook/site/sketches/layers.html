<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Collision layers</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; background: #14110e; overflow: hidden; }
    canvas { display: block; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js"></script>
</head>
<body>
<script>
// A notices B when A's mask bit overlaps B's layer bit.
const INK = [239, 230, 212];
const COPPER = [212, 120, 74];
const BLUE_GREEN = [72, 168, 154];
const GOLD = [228, 177, 90];
const DUST = [150, 136, 118];
const NAMES = ["player", "world", "enemy", "pickup"];

let plate;
const bodies = [
  { name: "Player", layer: 1, mask: 1 << 1 | 1 << 3 },
  { name: "World", layer: 1 << 1, mask: 1 | 1 << 2 },
  { name: "Bullet", layer: 1 << 2, mask: 1 },
  { name: "Coin", layer: 1 << 3, mask: 1 }
];

function setup() {
  createCanvas(windowWidth, windowHeight);
  pixelDensity(Math.min(2, window.devicePixelRatio || 1));
  textFont("IBM Plex Mono, ui-monospace, monospace");
  rebuild();
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  rebuild();
}

function rebuild() {
  plate = createGraphics(width, height);
  plate.pixelDensity(1);
  for (let y = 0; y < height; y++) {
    plate.stroke(lerp(16, 32, y / height), lerp(13, 22, y / height), lerp(11, 16, y / height));
    plate.line(0, y, width, y);
  }
  for (let i = 0; i < 1000; i++) {
    plate.stroke(239, 230, 212, random(5, 18));
    plate.point(random(width), random(height));
  }
}

function notices(a, b) {
  return (a.mask & b.layer) !== 0;
}

function cardBox(i) {
  const cols = width < 720 ? 1 : 2;
  const rows = Math.ceil(bodies.length / cols);
  const gap = 18;
  const w = Math.min(340, (width - 80 - gap) / cols);
  const h = Math.min(150, (height - 160 - gap * (rows - 1)) / rows);
  const col = i % cols;
  const row = Math.floor(i / cols);
  const totalW = cols * w + (cols - 1) * gap;
  const x = (width - totalW) / 2 + col * (w + gap);
  const y = 36 + row * (h + gap);
  return { x, y, w, h };
}

function draw() {
  image(plate, 0, 0);
  for (let i = 0; i < bodies.length; i++) {
    for (let j = i + 1; j < bodies.length; j++) {
      const aSees = notices(bodies[i], bodies[j]);
      const bSees = notices(bodies[j], bodies[i]);
      if (!aSees && !bSees) continue;
      const A = center(cardBox(i));
      const B = center(cardBox(j));
      stroke(aSees && bSees ? BLUE_GREEN[0] : GOLD[0], aSees && bSees ? BLUE_GREEN[1] : GOLD[1], aSees && bSees ? BLUE_GREEN[2] : GOLD[2], 160);
      strokeWeight(1.4);
      line(A.x, A.y, B.x, B.y);
    }
  }
  bodies.forEach((body, i) => drawCard(body, cardBox(i)));
  caption();
}

function center(box) {
  return { x: box.x + box.w / 2, y: box.y + box.h / 2 };
}

function drawCard(body, box) {
  noStroke();
  fill(18, 14, 11, 230);
  rect(box.x, box.y, box.w, box.h, 3);
  stroke(COPPER[0], COPPER[1], COPPER[2], 180);
  strokeWeight(1);
  noFill();
  rect(box.x, box.y, box.w, box.h, 3);
  noStroke();
  fill(INK);
  textAlign(LEFT, TOP);
  textSize(14);
  text(body.name, box.x + 14, box.y + 12);
  fill(DUST);
  textSize(10);
  text("LAYER", box.x + 14, box.y + 40);
  text("MASK", box.x + 14, box.y + 78);
  NAMES.forEach((name, bit) => {
    bitButton(box.x + 70 + bit * 62, box.y + 36, name, (body.layer & (1 << bit)) !== 0, BLUE_GREEN);
    bitButton(box.x + 70 + bit * 62, box.y + 74, name, (body.mask & (1 << bit)) !== 0, GOLD);
  });
}

function bitButton(x, y, name, on, col) {
  noStroke();
  fill(on ? col[0] : 40, on ? col[1] : 32, on ? col[2] : 28, on ? 220 : 255);
  rect(x, y, 56, 22, 2);
  fill(on ? 20 : DUST[0], on ? 16 : DUST[1], on ? 12 : DUST[2]);
  textAlign(CENTER, CENTER);
  textSize(9);
  text(name, x + 28, y + 11);
}

function caption() {
  noStroke();
  fill(20, 16, 13, 220);
  rect(24, height - 72, width - 48, 52, 3);
  fill(INK);
  textAlign(LEFT, CENTER);
  textSize(13);
  text("Blue-green is layer (what it is). Gold is mask (what it notices). A line means at least one of the pair would register a hit.", 40, height - 46);
}

function mousePressed() {
  bodies.forEach((body, i) => {
    const box = cardBox(i);
    NAMES.forEach((_, bit) => {
      if (inside(box.x + 70 + bit * 62, box.y + 36, 56, 22)) body.layer ^= 1 << bit;
      if (inside(box.x + 70 + bit * 62, box.y + 74, 56, 22)) body.mask ^= 1 << bit;
    });
  });
}

function inside(x, y, w, h) {
  return mouseX >= x && mouseX <= x + w && mouseY >= y && mouseY <= y + h;
}
</script>
</body>
</html>
